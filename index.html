<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa TV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Nota para la TV</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #161b26; --line: #262d3d; --text: #f4f5f7; --dim: #8a93a8;
    --accent: #f4f5f7; --ok: #34d399; --err: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); gap: 14px; overscroll-behavior: none; }
  body > * { flex-shrink: 0; }   /* when the page is taller than the screen, scroll instead of squashing */
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .kicker { font-size: 11px; letter-spacing: .18em; color: var(--dim); font-weight: 600; }
  .from { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 0 12px; height: 44px; }
  .from span { color: var(--dim); font-size: 13px; }
  .from input { flex: 1; background: none; border: 0; color: var(--text); font: inherit; outline: none; min-width: 0; height: 100%; }
  .board { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden;
    background: #10131b; border: 1px solid var(--line); touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hint { position: absolute; inset: 0; display: grid; place-items: center; color: #3b4458; font-size: 15px; pointer-events: none; transition: opacity .2s; }
  .tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .swatches, .sizes { display: flex; gap: 8px; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
  .sw[aria-pressed="true"] { border-color: var(--text); transform: scale(1.08); }
  .sz { width: 38px; height: 38px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
    display: grid; place-items: center; cursor: pointer; padding: 0; }
  .sz i { display: block; border-radius: 50%; background: var(--text); }
  .sz[aria-pressed="true"] { border-color: var(--text); }
  .actions { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 10px; margin-top: auto; }
  button.act { height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font: 600 15px/1 inherit; font-family: inherit; cursor: pointer; }
  button.send { background: var(--text); color: #0b0d12; border-color: var(--text); font-size: 16px; }
  button:disabled { opacity: .5; }
  .status { min-height: 20px; text-align: center; font-size: 14px; color: var(--dim); }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); }
  .track { display: none; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 16px; }
  .track.show { display: flex; }
  .track .steps { flex: 1; display: grid; gap: 4px; font-size: 14px; color: var(--dim); }
  .track .steps b { color: var(--text); font-weight: 600; }
  .track .reply { font-size: 34px; line-height: 1; min-width: 44px; text-align: center; }
  .track .reply.text { font-size: 17px; font-weight: 700; color: var(--text); min-width: 0; }
  .banner { position: fixed; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top)); z-index: 10;
    display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 18px;
    background: #f4f5f7; color: #0b0d12; box-shadow: 0 12px 40px rgba(0,0,0,.5);
    transform: translateY(-140%); transition: transform .35s cubic-bezier(.2,1.2,.4,1); }
  .banner.show { transform: none; }
  .banner .big { font-size: 38px; line-height: 1; }
  .banner .big.text { font-size: 20px; font-weight: 800; }
  .banner small { display: block; font-size: 13px; font-weight: 600; opacity: .6; }
  .banner b { font-size: 17px; }
  .tvstate { display: none; align-items: center; gap: 8px; padding: 7px 12px 7px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; color: var(--dim); white-space: nowrap; }
  .tvstate.show { display: inline-flex; }
  .tvstate i { width: 9px; height: 9px; border-radius: 50%; background: #4b5568; }
  .tvstate.on { color: var(--text); }
  .tvstate.on i { background: var(--ok); box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }
  header { align-items: center; }
  .targets { display: none; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .targets::-webkit-scrollbar { display: none; }
  .targets.show { display: flex; }
  .targets button { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 12px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    font: 600 14px/1 inherit; font-family: inherit; cursor: pointer; }
  .targets button i { width: 8px; height: 8px; border-radius: 50%; background: #4b5568; }
  .targets button.on i { background: var(--ok); }
  .targets button.all i { display: none; }
  .targets button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #0b0d12; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 4px; }
  .modes button { height: 40px; border: 0; border-radius: 10px; background: none; color: var(--dim);
    font: 600 15px/1 inherit; font-family: inherit; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--text); color: #0b0d12; }
  textarea.msg { display: none; width: 100%; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font: 17px/1.35 inherit; font-family: inherit; outline: none; }
  textarea.msg:focus { border-color: #4b5568; }
  body.write textarea.msg { display: block; }
  body.write #sizes, body.write #undo { display: none; }
  body.write .actions { grid-template-columns: 1fr 2fr; }
  .install { display: none; font-size: 13px; color: var(--dim); text-align: center; }
  .install.show { display: block; }
  .pop { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
  <header>
    <div>
      <div class="kicker">CASA TV</div>
      <h1>Nota para la TV</h1>
    </div>
    <div class="tvstate" id="tvstate"><i></i><span id="tvstateText"></span></div>
  </header>

  <div class="targets" id="targets" role="radiogroup" aria-label="Enviar a"></div>

  <div class="modes" role="tablist">
    <button id="mDraw" aria-pressed="true">✏️ Dibujar</button>
    <button id="mWrite" aria-pressed="false">Aa Escribir</button>
  </div>

  <label class="from"><span>De:</span><input id="from" maxlength="24" placeholder="Tu nombre" autocomplete="off"></label>

  <div class="board" id="board">
    <canvas id="c"></canvas>
    <div class="hint" id="hint">Dibuja aquí con el dedo ✏️</div>
  </div>
  <textarea class="msg" id="msg" rows="2" maxlength="160" placeholder="Escribe tu mensaje…"></textarea>

  <div class="tools">
    <div class="swatches" id="swatches"></div>
    <div class="sizes" id="sizes"></div>
  </div>

  <div class="actions">
    <button class="act" id="undo">Deshacer</button>
    <button class="act" id="clear">Borrar</button>
    <button class="act send" id="send">Enviar a la TV</button>
  </div>
  <div class="status" id="status"></div>
  <div class="install" id="install">Instálala: toca Compartir → «Añadir a pantalla de inicio» y te avisará cuando la TV responda.</div>
  <div class="banner" id="banner" role="status">
    <div class="big" id="bannerBig"></div>
    <div><small id="bannerWho">La TV respondió</small><b id="bannerText"></b></div>
  </div>
  <div class="track" id="track">
    <div class="steps">
      <div id="t1">Enviada</div>
      <div id="t2">Esperando que la vea…</div>
    </div>
    <div class="reply" id="reply"></div>
  </div>

<script>
(() => {
  const W = 1200, H = 900;                 // export size, 4:3 like the TV card
  const BG = '#10131b';
  const colors = ['#f4f5f7', '#ff5a5f', '#ffc53d', '#38d9a9', '#4dabf7', '#f783ac'];
  const sizes = [6, 14, 26];

  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const hint = document.getElementById('hint'), statusEl = document.getElementById('status');
  const fromEl = document.getElementById('from'), sendBtn = document.getElementById('send');
  let color = colors[0], size = sizes[1], strokes = [], current = null;
  let mode = 'draw';
  const msgEl = document.getElementById('msg');

  // Two ways to reach the TV: straight over the home Wi-Fi (page served by the TV, http),
  // or through the internet (page on Vercel, https) using the key from the TV's QR code.
  const CLOUD = {
    url: 'https://narursszyfdkwyytgtsa.supabase.co',
    key: 'sb_publishable_G6IBKMqNfM1xy1dlvzJaNQ_f9UwtAkp',
  };
  const online = location.protocol === 'https:';
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const VAPID = 'BAcUgZKWV52GtfQCoilRWVhmeJuocH77baoKtwmrK1j71nJkeJvdZtypb0Gb-q5rR4TovC7d_lvFksY1FfldmpI';
  let sendKey = '';
  if (online) {
    const m = location.hash.match(/k=([0-9a-f]{16,})/i);
    try {
      if (m) localStorage.setItem('casa-key', m[1]);
      sendKey = localStorage.getItem('casa-key') || '';
    } catch (e) { sendKey = m ? m[1] : ''; }
    const t = location.hash.match(/tv=([^&]+)/);
    if (t) { try { localStorage.setItem('casa-target-name', decodeURIComponent(t[1])); localStorage.removeItem('casa-target'); } catch (e) {} }
    // The installed app doesn't share storage with Safari, so in the browser the key stays in
    // the address: "Añadir a pantalla de inicio" saves this exact URL. Once installed, hide it.
    const want = standalone || !sendKey ? location.pathname : location.pathname + '#k=' + sendKey;
    if (location.pathname + location.hash !== want) history.replaceState(null, '', want);
  }
  const NO_KEY = standalone ? 'Borra la app y vuelve a instalarla desde la página del QR de la TV'
                            : 'Abre esta página escaneando el QR de la TV';
  const pushable = online && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  if (online && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  if (online && sendKey && !standalone && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
    document.getElementById('install').classList.add('show');
  }
  function b64urlToBytes(s) {
    const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4));
    return Uint8Array.from(b, ch => ch.charCodeAt(0));
  }
  // Ask the TV backend to push "La TV respondió" for this note, if the user allowed notifications.
  async function watchReply(id) {
    if (!pushable || !id || Notification.permission !== 'granted') return;
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription() ||
        await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(VAPID) });
      await rpc('note_push', { p_send_key: sendKey, p_id: id, p_sub: sub.toJSON() });
    } catch (e) {}
  }
  async function rpc(fn, args) {
    const res = await fetch(CLOUD.url + '/rest/v1/rpc/' + fn, {
      method: 'POST', cache: 'no-store',
      headers: { apikey: CLOUD.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(args),
    });
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }
  const api = online ? {
    async send(from) {
      const b64 = c.toDataURL('image/png').split(',')[1];
      return await rpc('send_note', { p_send_key: sendKey, p_from: from, p_image: b64, p_tv: target === 'all' ? null : target });
    },
    status: id => rpc('note_status', { p_send_key: sendKey, p_id: id }),
  } : {
    async send(from) {
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      const res = await fetch('/note', {
        method: 'POST',
        headers: { 'Content-Type': 'image/png', 'X-From': encodeURIComponent(from) },
        body: blob,
      });
      if (!res.ok) throw new Error(res.status);
      try { return (await res.json()).id || ''; } catch (e) { return ''; }
    },
    async status(id) {
      const r = await fetch('/status?id=' + encodeURIComponent(id), { cache: 'no-store' });
      const st = await r.json();
      return { ...st, delivered: st.known };   // on the Wi-Fi a note shows up instantly
    },
  };

  try { fromEl.value = localStorage.getItem('casa-from') || ''; } catch (e) {}
  fromEl.addEventListener('change', () => { try { localStorage.setItem('casa-from', fromEl.value.trim()); } catch (e) {} });

  // Toolbar
  const sw = document.getElementById('swatches');
  colors.forEach((col, i) => {
    const b = document.createElement('button');
    b.className = 'sw'; b.style.background = col; b.setAttribute('aria-label', 'Color');
    b.setAttribute('aria-pressed', i === 0);
    b.onclick = () => { color = col; sw.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', x === b)); paint(); };
    sw.appendChild(b);
  });
  const sz = document.getElementById('sizes');
  sizes.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'sz'; b.setAttribute('aria-label', 'Grosor');
    b.setAttribute('aria-pressed', i === 1);
    const dot = document.createElement('i'); const d = 4 + i * 6; dot.style.width = dot.style.height = d + 'px';
    b.appendChild(dot);
    b.onclick = () => { size = s; sz.querySelectorAll('.sz').forEach(x => x.setAttribute('aria-pressed', x === b)); };
    sz.appendChild(b);
  });

  // Canvas works in export coordinates; CSS scales it to the screen.
  c.width = W; c.height = H;
  function paint() {
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    if (mode === 'write') {
      const t = msgEl.value.trim();
      drawText(t);
      hint.textContent = 'Escribe abajo ✍️';
      hint.style.opacity = t ? 0 : 1;
      return;
    }
    hint.textContent = 'Dibuja aquí con el dedo ✏️';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const s of strokes) drawStroke(s);
    if (current) drawStroke(current);
    hint.style.opacity = strokes.length || current ? 0 : 1;
  }
  function drawStroke(s) {
    const p = s.pts;
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = s.size;
    if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0], p[0][1], s.size / 2, 0, Math.PI * 2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) {
      const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
      ctx.quadraticCurveTo(p[i][0], p[i][1], mx, my);
    }
    const last = p[p.length - 1]; ctx.lineTo(last[0], last[1]); ctx.stroke();
  }
  // Typed message: biggest font that fits, centered, in the chosen color.
  const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  function wrap(text, maxW) {
    const lines = [];
    for (const para of text.split('\n')) {
      let line = '';
      for (const word of para.split(/\s+/).filter(Boolean)) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width <= maxW || !line) {
          if (!line && ctx.measureText(word).width > maxW) {   // one very long word: cut it
            let chunk = '';
            for (const ch of [...word]) {
              if (ctx.measureText(chunk + ch).width > maxW && chunk) { lines.push(chunk); chunk = ''; }
              chunk += ch;
            }
            line = chunk;
          } else line = test;
        } else { lines.push(line); line = word; }
      }
      lines.push(line);
    }
    return lines;
  }
  function drawText(text) {
    if (!text) return;
    const pad = 90, maxW = W - pad * 2, maxH = H - pad * 2;
    let sizePx = 150, lines = [];
    for (; sizePx >= 34; sizePx -= 6) {
      ctx.font = `800 ${sizePx}px ${FONT}`;
      lines = wrap(text, maxW);
      if (lines.length * sizePx * 1.18 <= maxH && lines.every(l => ctx.measureText(l).width <= maxW)) break;
    }
    const lh = sizePx * 1.18, top = (H - lines.length * lh) / 2 + lh / 2;
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    lines.forEach((l, i) => ctx.fillText(l, W / 2, top + i * lh));
  }

  function setMode(m) {
    mode = m;
    document.body.classList.toggle('write', m === 'write');
    document.getElementById('mDraw').setAttribute('aria-pressed', m === 'draw');
    document.getElementById('mWrite').setAttribute('aria-pressed', m === 'write');
    setStatus(''); paint();
    if (m === 'write') msgEl.focus();
  }
  document.getElementById('mDraw').onclick = () => setMode('draw');
  document.getElementById('mWrite').onclick = () => setMode('write');
  msgEl.addEventListener('input', () => { setStatus(''); paint(); });

  function pos(e) {
    const r = c.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
  }
  c.addEventListener('pointerdown', e => {
    if (mode === 'write') { msgEl.focus(); return; }
    e.preventDefault(); c.setPointerCapture(e.pointerId);
    current = { color, size, pts: [pos(e)] }; setStatus(''); paint();
  });
  c.addEventListener('pointermove', e => {
    if (!current) return; e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs) current.pts.push(pos(ev));
    paint();
  });
  const end = () => { if (current) { strokes.push(current); current = null; paint(); } };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  document.addEventListener('touchmove', e => { if (e.target === c) e.preventDefault(); }, { passive: false });

  document.getElementById('undo').onclick = () => { strokes.pop(); paint(); };
  document.getElementById('clear').onclick = () => {
    if (mode === 'write') msgEl.value = ''; else strokes = [];
    paint(); setStatus('');
  };

  function setStatus(msg, kind) { statusEl.textContent = msg; statusEl.className = 'status' + (kind ? ' ' + kind : ''); }

  sendBtn.onclick = async () => {
    if (mode === 'draw' && !strokes.length) { setStatus('Dibuja algo primero', 'err'); return; }
    if (mode === 'write' && !msgEl.value.trim()) { setStatus('Escribe algo primero', 'err'); return; }
    paint();
    const from = fromEl.value.trim();
    try { localStorage.setItem('casa-from', from); } catch (e) {}
    if (online && !sendKey) { setStatus(NO_KEY, 'err'); return; }
    // iOS only shows the permission prompt from a tap, so ask here, before anything else is awaited.
    const asked = pushable && Notification.permission === 'default' && (standalone || !/iPhone|iPad|iPod/.test(navigator.userAgent))
      ? Notification.requestPermission().catch(() => {}) : null;
    sendBtn.disabled = true; setStatus('Enviando…');
    try {
      const id = await api.send(from);
      setStatus('');
      if (mode === 'write') { msgEl.value = ''; msgEl.blur(); } else strokes = [];
      paint();
      follow(id);
      if (online) Promise.resolve(asked).then(() => watchReply(id));
    } catch (e) {
      setStatus(online ? 'No se pudo enviar. Revisa tu conexión.' : 'No llegó. ¿Estás en el Wi-Fi de la casa?', 'err');
    } finally { sendBtn.disabled = false; }
  };

  // Follow the note: arrived -> seen -> reply. Survives closing and reopening the page.
  const track = document.getElementById('track'), t1 = document.getElementById('t1'),
        t2 = document.getElementById('t2'), replyEl = document.getElementById('reply');
  const banner = document.getElementById('banner'), bannerBig = document.getElementById('bannerBig'),
        bannerText = document.getElementById('bannerText');
  let followTimer = null, followId = '', followStart = 0;
  const store = {
    get() { try { return JSON.parse(localStorage.getItem('casa-last') || 'null'); } catch (e) { return null; } },
    set(v) { try { v ? localStorage.setItem('casa-last', JSON.stringify(v)) : localStorage.removeItem('casa-last'); } catch (e) {} },
  };
  banner.onclick = () => banner.classList.remove('show');

  function showReply(reply, announce, who) {
    const isText = [...reply].length > 2;
    t2.innerHTML = '<b>' + (who ? esc(who) + ' respondió' : 'Respondió') + '</b>';
    document.getElementById('bannerWho').textContent = (who || 'La TV') + ' respondió';
    replyEl.textContent = reply;
    replyEl.className = 'reply pop' + (isText ? ' text' : '');
    if (!announce) return;
    bannerBig.textContent = reply;
    bannerBig.className = 'big pop' + (isText ? ' text' : '');
    bannerText.textContent = isText ? '' : 'a tu nota';
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 6000);
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  }

  function follow(id, resumed) {
    clearTimeout(followTimer);
    followId = id; followStart = Date.now();
    track.classList.add('show');
    t1.innerHTML = '<b>Enviada ✓</b>';
    t2.textContent = 'Esperando a la TV…';
    replyEl.textContent = ''; replyEl.className = 'reply';
    if (!resumed) setTimeout(() => track.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
    if (!id) return;
    if (!resumed) store.set({ id, reply: null });
    tick();
  }

  async function tick(resumed) {
    clearTimeout(followTimer);
    const id = followId;
    if (!id) return;
    try {
      const st = await api.status(id);
      if (id !== followId) return;
      const place = st.targets > 1 ? 'las TV' : (st.delivered_tv || 'la TV');
      if (st.delivered) {
        t1.innerHTML = '<b>Llegó a ' + esc(st.targets > 1 ? st.delivered_tv || 'la TV' : place) + ' ✓</b>';
        if (!st.seen) t2.textContent = 'Esperando que la vean…';
      } else if (online && targetOn() === false) {
        t2.textContent = (st.targets > 1 ? 'Las TV están apagadas' : 'Esa TV está apagada') + ': la verán al prenderla';
      }
      if (!st.known) { track.classList.remove('show'); store.set(null); followId = ''; return; }
      if (st.reply) {
        const saved = store.get();
        const isNew = !(saved && saved.id === id && saved.reply === st.reply);
        showReply(st.reply, isNew, st.reply_tv);
        store.set({ id, reply: st.reply });
        followId = '';
        return;
      }
      if (st.seen) { t2.innerHTML = '<b>' + (st.seen_tv && st.targets > 1 ? 'Vista en ' + esc(st.seen_tv) : 'Vista') + ' 👀</b>'; followId = ''; return; }
    } catch (e) {}
    if (Date.now() - followStart < 60 * 60 * 1000) followTimer = setTimeout(tick, 2000);
  }

  // Phones pause timers in the background: check again as soon as the page is visible.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && followId) tick(); });

  if (online && !sendKey) setStatus(NO_KEY, 'err');

  // Is the TV on? (online page only; the Wi-Fi page is served by the TV itself, so it's on.)
  const tvEl = document.getElementById('tvstate'), tvText = document.getElementById('tvstateText');
  let tvOn = null, tvTimer = null;
  function ago(iso) {
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 1) return 'ahora';
    if (mins < 60) return `hace ${mins} min`;
    const h = Math.round(mins / 60);
    if (h < 24) return `hace ${h} h`;
    const d = Math.round(h / 24);
    return d === 1 ? 'desde ayer' : `hace ${d} días`;
  }
  // Which TV the note goes to: a TV id, or 'all'.
  const targetsEl = document.getElementById('targets');
  let tvs = [], target = 'all';
  try { target = localStorage.getItem('casa-target') || 'all'; } catch (e) {}
  function esc(x) { const d = document.createElement('div'); d.textContent = x; return d.innerHTML; }
  function targetOn() {
    if (!tvs.length) return tvOn;
    if (target === 'all') return tvs.some(t => t.on);
    const t = tvs.find(t => t.id === target);
    return t ? t.on : null;
  }
  function pick(id) {
    target = id;
    try { localStorage.setItem('casa-target', id); localStorage.removeItem('casa-target-name'); } catch (e) {}
    renderTvs();
  }
  function renderTvs() {
    // Several TVs: a chip for each plus "Todas"; the header shows the chosen one.
    if (tvs.length < 2) { targetsEl.classList.remove('show'); target = tvs[0] ? tvs[0].id : 'all'; }
    else {
      targetsEl.classList.add('show');
      targetsEl.innerHTML = '';
      const add = (id, label, on, cls) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = (on ? 'on ' : '') + (cls || '');
        b.setAttribute('aria-pressed', target === id);
        b.innerHTML = '<i></i>' + esc(label);
        b.onclick = () => pick(id);
        targetsEl.appendChild(b);
      };
      tvs.forEach(t => add(t.id, t.name, t.on));
      add('all', 'Todas', false, 'all');
    }
    const chosen = tvs.find(t => t.id === target);
    sendBtn.textContent = tvs.length < 2 ? 'Enviar a la TV' : chosen ? `Enviar a ${chosen.name}` : 'Enviar a todas';
    if (chosen) {
      tvOn = chosen.on;
      const who = tvs.length > 1 ? chosen.name : 'TV';
      tvText.textContent = chosen.on ? `${who} encendida` : `${who} apagada` + (chosen.since ? ' · ' + ago(chosen.since) : '');
    } else {
      const n = tvs.filter(t => t.on).length;
      tvOn = n > 0;
      tvText.textContent = n === tvs.length ? 'Todas encendidas' : n === 0 ? 'Todas apagadas' : `${n} de ${tvs.length} encendidas`;
    }
    tvEl.classList.add('show');
    tvEl.classList.toggle('on', !!tvOn);
  }
  async function checkTv() {
    clearTimeout(tvTimer);
    if (!online || !sendKey) return;
    try {
      const st = await rpc('tv_status', { p_send_key: sendKey });
      if (st.known && st.tvs && st.tvs.length) {
        tvs = st.tvs;
        let wanted = null;
        try { wanted = localStorage.getItem('casa-target-name'); } catch (e) {}
        if (wanted) {
          const byName = tvs.find(t => t.name.toLowerCase() === wanted.toLowerCase());
          if (byName) { target = byName.id; try { localStorage.setItem('casa-target', target); localStorage.removeItem('casa-target-name'); } catch (e) {} }
        }
        if (target !== 'all' && !tvs.some(t => t.id === target)) target = 'all';
        renderTvs();
      } else if (st.known) {
        tvOn = !!st.on;
        tvEl.classList.add('show');
        tvEl.classList.toggle('on', tvOn);
        tvText.textContent = tvOn ? 'TV encendida' : ('TV apagada' + (st.since ? ' · ' + ago(st.since) : ''));
      }
    } catch (e) {}
    if (!document.hidden) tvTimer = setTimeout(checkTv, 15000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkTv(); });
  checkTv();

  // Reopened the page? Pick up the last note where we left it.
  const last = store.get();
  if (last && last.id) {
    follow(last.id, true);
  }

  paint();
})();
</script>
